<!DOCTYPE html>

    <title>Taxi Körkort Sverige Simulator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        taxi: '#FFCC00',
                        taxidark: '#E6B800',
                        slate: {
                            850: '#151e2e',
                            900: '#0f172a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Tajawal', 'sans-serif'],
                    }
                }
            }

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', 'Tajawal', sans-serif;
            overscroll-behavior-y: contain;
        }
        #app-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: #0f172a;
            color: #ffffff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .fade-in {
            animation: fadeIn 0.25s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .correct-answer {
            background-color: #22c55e !important;
            color: #ffffff !important;
            border-color: #16a34a !important;
        }
        .wrong-answer {
            background-color: #ef4444 !important;
            color: #ffffff !important;
            border-color: #dc2626 !important;
        }
        .disabled-option {
            pointer-events: none;
            opacity: 0.85;
        }
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- Header -->
        <header class="bg-taxi text-slate-900 px-4 py-3.5 flex justify-between items-center z-10 shadow-md shrink-0">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center text-taxi font-black text-sm">
                    <i class="fa-solid fa-taxi"></i>
                </div>
                <div>
                    <h1 id="header-title" class="font-extrabold text-base leading-none">Taxi Körkort</h1>
                    <span id="header-subtitle" class="text-[10px] text-slate-800 font-semibold leading-none">Sverige (TFL)</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="lang-toggle" onclick="app.cycleLanguage()" class="bg-slate-900 text-taxi px-3 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider hover:bg-slate-800 active:scale-95 transition">
                    SV
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="flex-1 overflow-y-auto p-4 relative pb-20">
            <!-- Content will be injected dynamically -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bg-slate-850 px-6 py-2.5 flex justify-around items-center border-t border-slate-700/80 shrink-0">
            <button onclick="app.goHome()" id="nav-btn-home" class="flex flex-col items-center text-taxi transition py-1">
                <i class="fa-solid fa-house text-base mb-1"></i>
                <span class="text-[11px] font-semibold" id="nav-home-text">Home</span>
            </button>
            <button onclick="app.goStats()" id="nav-btn-stats" class="flex flex-col items-center text-slate-400 hover:text-slate-200 transition py-1">
                <i class="fa-solid fa-chart-simple text-base mb-1"></i>
                <span class="text-[11px] font-medium" id="nav-stats-text">Statistics</span>
            </button>
            <button onclick="app.goSettings()" id="nav-btn-profile" class="flex flex-col items-center text-slate-400 hover:text-slate-200 transition py-1">
                <i class="fa-solid fa-gear text-base mb-1"></i>
                <span class="text-[11px] font-medium" id="nav-profile-text">Settings</span>
            </button>
        </nav>
    </div>

        // --- App Engine --- //
        const app = {
            lang: localStorage.getItem('taxi_lang') || 'en', // Default is English as requested!
            currentView: 'home',
            score: 0,
            currentQuestionIndex: 0,
            hasAnswered: false,
            activeQuestions: [],

            init() {
                this.updateDocumentLanguage();
                this.updateStaticUI();
                this.renderHome();
            },

            cycleLanguage() {
                if (this.lang === 'en') this.lang = 'sv';
                else if (this.lang === 'sv') this.lang = 'ar';
                else this.lang = 'en';

                localStorage.setItem('taxi_lang', this.lang);
                this.updateDocumentLanguage();
                this.updateStaticUI();

                if (this.currentView === 'home') this.renderHome();
                else if (this.currentView === 'quiz') this.renderQuiz();
                else if (this.currentView === 'results') this.renderResults();
                else if (this.currentView === 'stats') this.renderStats();
                else if (this.currentView === 'settings') this.renderSettings();
            },

            setLanguage(newLang) {
                this.lang = newLang;
                localStorage.setItem('taxi_lang', this.lang);
                this.updateDocumentLanguage();
                this.updateStaticUI();
                if (this.currentView === 'settings') this.renderSettings();
                else this.goHome();
            },

            updateDocumentLanguage() {
                const htmlElement = document.documentElement;
                htmlElement.lang = this.lang;
                htmlElement.dir = this.lang === 'ar' ? 'rtl' : 'ltr';
            },

            t(key) {
                return (translations[this.lang] && translations[this.lang][key]) || translations['en'][key] || key;
            },

            updateStaticUI() {
                document.getElementById('header-title').innerText = this.t('app_title');
                document.getElementById('header-subtitle').innerText = this.t('app_sub');
                document.getElementById('lang-toggle').innerText = this.lang.toUpperCase();
                document.getElementById('nav-home-text').innerText = this.t('nav_home');
                document.getElementById('nav-stats-text').innerText = this.t('nav_stats');
                document.getElementById('nav-profile-text').innerText = this.t('nav_profile');

                // Update active tab styles
                ['home', 'stats', 'profile'].forEach(tab => {
                    const btn = document.getElementById('nav-btn-' + tab);
                    if (btn) {
                        if ((tab === 'home' && this.currentView === 'home') ||
                            (tab === 'stats' && this.currentView === 'stats') ||
                            (tab === 'profile' && this.currentView === 'settings')) {
                            btn.className = "flex flex-col items-center text-taxi transition py-1";
                        } else {
                            btn.className = "flex flex-col items-center text-slate-400 hover:text-slate-200 transition py-1";
                        }
                    }
                });
            },

            goHome() {
                this.currentView = 'home';
                this.updateStaticUI();
                this.renderHome();
            },

            goStats() {
                this.currentView = 'stats';
                this.updateStaticUI();
                this.renderStats();
            },

            goSettings() {
                this.currentView = 'settings';
                this.updateStaticUI();
                this.renderSettings();
            },

            startQuiz(category) {
                this.currentView = 'quiz';
                this.score = 0;
                this.currentQuestionIndex = 0;
                this.hasAnswered = false;

                if (category === 'all' || category === 'mock') {
                    this.activeQuestions = [...questionsData].sort(() => 0.5 - Math.random());
                } else {
                    this.activeQuestions = questionsData.filter(q => q.category === category);
                }

                this.updateStaticUI();
                this.renderQuiz();
            },

            renderHome() {
                const mainContent = document.getElementById('main-content');
                mainContent.innerHTML = `
                    <div class="fade-in pt-3 space-y-4">
                        <div class="mb-4">
                            <h2 class="text-2xl font-black text-white">${this.t('home_welcome')}</h2>
                            <p class="text-slate-400 text-xs mt-0.5">${this.t('home_subtitle')}</p>
                        </div>

                        <!-- Hero Card: Mock Exam -->
                        <div onclick="app.startQuiz('mock')" class="bg-gradient-to-r from-slate-850 to-slate-800 rounded-2xl p-5 border border-slate-700 active:scale-[0.98] transition cursor-pointer shadow-lg">
                            <div class="flex items-center gap-3 mb-2">
                                <div class="w-10 h-10 rounded-full bg-taxi/20 flex items-center justify-center text-taxi text-lg shrink-0">
                                    <i class="fa-solid fa-graduation-cap"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-white text-base leading-tight">${this.t('cat_mock')}</h3>
                                    <span class="text-xs text-taxi font-semibold">${this.t('cat_mock_sub')}</span>
                                </div>
                            </div>
                            <p class="text-xs text-slate-300 mt-2">Pass benchmark: 75% • Full coverage of Swedish Taxi Regulations</p>
                            <div class="mt-4">
                                <button class="w-full bg-taxi text-slate-900 font-bold py-2.5 rounded-xl text-sm flex items-center justify-center gap-2 shadow">
                                    <i class="fa-solid fa-play text-xs"></i>
                                    <span>${this.t('btn_start')}</span>
                                </button>
                            </div>
                        </div>

                        <div class="pt-2">
                            <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">Study Categories</h3>
                        </div>

                        <!-- Category 1: Law -->
                        <div onclick="app.startQuiz('law')" class="bg-slate-800 rounded-2xl p-4 flex items-center border border-slate-700 active:bg-slate-750 transition cursor-pointer">
                            <div class="bg-blue-500/20 w-12 h-12 rounded-full flex items-center justify-center text-blue-400 mr-3.5 rtl:ml-3.5 rtl:mr-0 shrink-0">
                                <i class="fa-solid fa-scale-balanced text-lg"></i>
                            </div>
                            <div class="flex-1">
                                <h4 class="font-bold text-sm text-white">${this.t('cat_law')}</h4>
                                <p class="text-xs text-slate-400 mt-0.5">${this.t('cat_law_sub')}</p>
                            </div>
                            <i class="fa-solid fa-chevron-right rtl:fa-chevron-left text-slate-500 text-xs"></i>
                        </div>

                        <!-- Category 2: Safety -->
                        <div onclick="app.startQuiz('safety')" class="bg-slate-800 rounded-2xl p-4 flex items-center border border-slate-700 active:bg-slate-750 transition cursor-pointer">
                            <div class="bg-green-500/20 w-12 h-12 rounded-full flex items-center justify-center text-green-400 mr-3.5 rtl:ml-3.5 rtl:mr-0 shrink-0">
                                <i class="fa-solid fa-shield-heart text-lg"></i>
                            </div>
                            <div class="flex-1">
                                <h4 class="font-bold text-sm text-white">${this.t('cat_safety')}</h4>
                                <p class="text-xs text-slate-400 mt-0.5">${this.t('cat_safety_sub')}</p>
                            </div>
                            <i class="fa-solid fa-chevron-right rtl:fa-chevron-left text-slate-500 text-xs"></i>
                        </div>

                        <!-- Category 3: Map & Navigation -->
                        <div onclick="app.startQuiz('map')" class="bg-slate-800 rounded-2xl p-4 flex items-center border border-slate-700 active:bg-slate-750 transition cursor-pointer">
                            <div class="bg-taxi/20 w-12 h-12 rounded-full flex items-center justify-center text-taxi mr-3.5 rtl:ml-3.5 rtl:mr-0 shrink-0">
                                <i class="fa-solid fa-map-location-dot text-lg"></i>
                            </div>
                            <div class="flex-1">
                                <h4 class="font-bold text-sm text-white">${this.t('cat_map')}</h4>
                                <p class="text-xs text-slate-400 mt-0.5">${this.t('cat_map_sub')}</p>
                            </div>
                            <i class="fa-solid fa-chevron-right rtl:fa-chevron-left text-slate-500 text-xs"></i>
                        </div>
                    </div>
                `;
            },

            renderQuiz() {
                this.hasAnswered = false;
                const total = this.activeQuestions.length;
                const questionData = this.activeQuestions[this.currentQuestionIndex];
                const langData = questionData[this.lang] || questionData['en'];

                const progressPct = ((this.currentQuestionIndex + 1) / total) * 100;
                const progressText = this.t('question_of')
                    .replace('{current}', this.currentQuestionIndex + 1)
                    .replace('{total}', total);

                const optionsHtml = langData.options.map((opt, idx) => `
                    <button id="opt-${idx}" class="quiz-option w-full bg-slate-800 border border-slate-700 rounded-xl p-3.5 text-start hover:border-slate-500 transition text-sm flex items-center justify-between" onclick="app.selectOption(${idx}, ${opt.isCorrect})">
                        <span class="font-medium text-slate-100">${opt.text}</span>
                        <i id="opt-icon-${idx}" class="fa-solid hidden text-base"></i>
                    </button>
                `).join('');

                const swedishSubtitle = (this.lang !== 'sv' && questionData.sv) ? `
                    <div class="bg-slate-900/80 rounded-lg p-2.5 mt-3 border border-slate-700/60 text-xs text-slate-300 italic">
                        <span class="text-taxi font-bold not-italic">🇸🇪 Svenska:</span> ${questionData.sv.text}
                    </div>
                ` : '';

                const mainContent = document.getElementById('main-content');
                mainContent.innerHTML = `
                    <div class="fade-in pt-1 flex flex-col min-h-full">
                        <!-- Progress Bar -->
                        <div class="mb-4">
                            <div class="flex justify-between text-xs text-slate-400 font-bold mb-1.5 uppercase">
                                <span>${progressText}</span>
                                <span class="text-taxi">${Math.round(progressPct)}%</span>
                            </div>
                            <div class="w-full bg-slate-800 rounded-full h-2">
                                <div class="bg-taxi h-2 rounded-full transition-all duration-300" style="width: ${progressPct}%"></div>
                            </div>
                        </div>

                        <!-- Question Card -->
                        <div class="bg-slate-850 border border-slate-700 rounded-2xl p-4 mb-4 shadow">
                            <h3 class="text-base font-bold text-white leading-snug">${langData.text}</h3>
                            ${swedishSubtitle}
                        </div>

                        <!-- Options Container -->
                        <div class="space-y-2.5 mb-4" id="options-container">
                            ${optionsHtml}
                        </div>

                        <!-- Explanation Area -->
                        <div id="explanation-box" class="hidden bg-slate-800 border-l-4 rtl:border-l-0 rtl:border-r-4 border-taxi p-3.5 rounded-xl mb-4">
                            <h4 class="font-bold text-taxi mb-1 text-xs uppercase">${this.t('explanation_title')}</h4>
                            <p class="text-xs text-slate-300 leading-relaxed">${langData.explanation}</p>
                        </div>

                        <!-- Next / Finish Button -->
                        <div class="mt-auto pt-2">
                            <button id="next-btn" class="hidden w-full bg-taxi text-slate-900 font-extrabold text-base py-3.5 rounded-xl shadow-lg active:bg-taxidark transition" onclick="app.nextQuestion()">
                                ${this.currentQuestionIndex === total - 1 ? this.t('btn_finish') : this.t('btn_next')}
                            </button>
                        </div>
                    </div>
                `;
            },

            selectOption(selectedIndex, isCorrect) {
                if (this.hasAnswered) return;
                this.hasAnswered = true;

                if (isCorrect) this.score++;

                const questionData = this.activeQuestions[this.currentQuestionIndex];
                const langData = questionData[this.lang] || questionData['en'];

                const optionsContainer = document.getElementById('options-container');
                const options = optionsContainer.getElementsByClassName('quiz-option');

                Array.from(options).forEach((optEl, idx) => {
                    optEl.classList.add('disabled-option');
                    const iconEl = document.getElementById(`opt-icon-${idx}`);
                    if (langData.options[idx].isCorrect) {
                        optEl.classList.add('correct-answer');
                        if (iconEl) {
                            iconEl.classList.remove('hidden');
                            iconEl.classList.add('fa-circle-check', 'text-white');
                        }
                    } else if (idx === selectedIndex && !isCorrect) {
                        optEl.classList.add('wrong-answer');
                        if (iconEl) {
                            iconEl.classList.remove('hidden');
                            iconEl.classList.add('fa-circle-xmark', 'text-white');
                        }
                    }
                });

                document.getElementById('explanation-box').classList.remove('hidden');
                document.getElementById('next-btn').classList.remove('hidden');
            },

            nextQuestion() {
                this.currentQuestionIndex++;
                if (this.currentQuestionIndex >= this.activeQuestions.length) {
                    this.saveTestRecord();
                    this.currentView = 'results';
                    this.renderResults();
                } else {
                    this.renderQuiz();
                }
            },

            saveTestRecord() {
                try {
                    const history = JSON.parse(localStorage.getItem('taxi_history') || '[]');
                    const total = this.activeQuestions.length;
                    const pct = Math.round((this.score / total) * 100);
                    history.push({
                        date: new Date().toISOString(),
                        score: this.score,
                        total: total,
                        pct: pct,
                        passed: pct >= 75
                    });
                    localStorage.setItem('taxi_history', JSON.stringify(history));
                } catch(e) {
                    console.error("DOMStorage save error:", e);
                }
            },

            renderResults() {
                const total = this.activeQuestions.length;
                const percentage = Math.round((this.score / total) * 100);
                const isPass = percentage >= 75;

                const message = isPass ? this.t('results_pass') : this.t('results_fail');
                const ringColor = isPass ? 'border-green-500' : 'border-taxi';

                const mainContent = document.getElementById('main-content');
                mainContent.innerHTML = `
                    <div class="fade-in pt-6 flex flex-col items-center text-center">
                        <div class="w-28 h-28 rounded-full border-4 ${ringColor} flex flex-col items-center justify-center mb-4 bg-slate-800 shadow">
                            <span class="text-3xl font-black text-white">${this.score}/${total}</span>
                            <span class="text-xs font-bold text-slate-300">${percentage}%</span>
                        </div>

                        <h2 class="text-2xl font-bold mb-1">${this.t('results_title')}</h2>
                        <p class="text-sm text-slate-300 mb-6 px-4">${message}</p>

                        <div class="w-full bg-slate-800 rounded-2xl p-4 mb-6 border border-slate-700 text-sm">
                            <div class="flex justify-between py-2 border-b border-slate-700/60">
                                <span class="text-slate-400">${this.t('lbl_correct')}</span>
                                <span class="font-bold text-green-400">${this.score}</span>
                            </div>
                            <div class="flex justify-between py-2 border-b border-slate-700/60">
                                <span class="text-slate-400">${this.t('lbl_wrong')}</span>
                                <span class="font-bold text-red-400">${total - this.score}</span>
                            </div>
                            <div class="flex justify-between py-2">
                                <span class="text-slate-400">${this.t('lbl_accuracy')}</span>
                                <span class="font-bold text-taxi">${percentage}%</span>
                            </div>
                        </div>

                        <div class="w-full space-y-2.5">
                            <button onclick="app.startQuiz('all')" class="w-full bg-taxi text-slate-900 font-bold py-3.5 rounded-xl shadow active:bg-taxidark transition">
                                ${this.t('btn_try_again')}
                            </button>
                            <button onclick="app.goHome()" class="w-full bg-slate-700 text-white font-semibold py-3.5 rounded-xl hover:bg-slate-600 transition">
                                ${this.t('btn_back_home')}
                            </button>
                        </div>
                    </div>
                `;
            },

            renderStats() {
                let history = [];
                try {
                    history = JSON.parse(localStorage.getItem('taxi_history') || '[]');
                } catch(e) {}

                const total = history.length;
                const passed = history.filter(h => h.passed).length;
                const rate = total > 0 ? Math.round((passed / total) * 100) : 0;

                const mainContent = document.getElementById('main-content');
                mainContent.innerHTML = `
                    <div class="fade-in pt-3 space-y-4">
                        <h2 class="text-2xl font-black text-white">${this.t('nav_stats')}</h2>

                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 text-center">
                                <span class="text-2xl font-black text-taxi">${total}</span>
                                <p class="text-xs text-slate-400 mt-1">${this.t('stat_total_tests')}</p>
                            </div>
                            <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 text-center">
                                <span class="text-2xl font-black ${rate >= 75 ? 'text-green-400' : 'text-taxi'}">${rate}%</span>
                                <p class="text-xs text-slate-400 mt-1">${this.t('stat_pass_rate')}</p>
                            </div>
                        </div>

                        <div class="bg-slate-850 rounded-2xl p-4 border border-slate-700">
                            <h4 class="font-bold text-sm text-white mb-2">Trafikverket Benchmark</h4>
                            <div class="w-full bg-slate-800 rounded-full h-2 mb-2">
                                <div class="bg-green-500 h-2 rounded-full" style="width: ${rate}%"></div>
                            </div>
                            <p class="text-[11px] text-slate-400">Target passing score is 75% for Swedish commercial taxi driver licensing.</p>
                        </div>

                        <div class="pt-2">
                            <button onclick="localStorage.removeItem('taxi_history'); app.renderStats();" class="text-xs text-red-400 hover:text-red-300 underline">
                                ${this.t('lbl_reset')}
                            </button>
                        </div>
                    </div>
                `;
            },

            renderSettings() {
                const mainContent = document.getElementById('main-content');
                mainContent.innerHTML = `
                    <div class="fade-in pt-3 space-y-4">
                        <h2 class="text-2xl font-black text-white">${this.t('nav_profile')}</h2>

                        <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 space-y-3">
                            <h4 class="text-xs font-bold text-taxi uppercase tracking-wider">${this.t('settings_lang_title')}</h4>
                            
                            <button onclick="app.setLanguage('en')" class="w-full flex items-center justify-between p-3 rounded-xl border ${this.lang === 'en' ? 'border-taxi bg-slate-850 text-taxi' : 'border-slate-700 text-slate-300'}">
                                <span class="font-semibold text-sm">English (Default)</span>
                                ${this.lang === 'en' ? '<i class="fa-solid fa-check"></i>' : ''}
                            </button>

                            <button onclick="app.setLanguage('sv')" class="w-full flex items-center justify-between p-3 rounded-xl border ${this.lang === 'sv' ? 'border-taxi bg-slate-850 text-taxi' : 'border-slate-700 text-slate-300'}">
                                <span class="font-semibold text-sm">Svenska</span>
                                ${this.lang === 'sv' ? '<i class="fa-solid fa-check"></i>' : ''}
                            </button>

                            <button onclick="app.setLanguage('ar')" class="w-full flex items-center justify-between p-3 rounded-xl border ${this.lang === 'ar' ? 'border-taxi bg-slate-850 text-taxi' : 'border-slate-700 text-slate-300'}">
                                <span class="font-semibold text-sm">العربية</span>
                                ${this.lang === 'ar' ? '<i class="fa-solid fa-check"></i>' : ''}
                            </button>
                        </div>

                        <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 text-xs text-slate-300 space-y-2">
                            <h4 class="font-bold text-white text-sm">Swedish Taxi License (TFL)</h4>
                            <p>To acquire the Swedish Taxiförarlegitimation, candidates must pass theoretical examinations at Trafikverket and meet medical and licensing prerequisites.</p>
                        </div>
                    </div>
                `;
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
