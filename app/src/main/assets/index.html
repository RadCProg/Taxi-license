                        { text: "السرعة القصوى محددة بـ 10 كم/س في جميع الأرجاء", isCorrect: false },
                        { text: "يُمنع نقل الركاب تجارياً في تلك المنطقة", isCorrect: false }
                    ],
                    explanation: "المناطق البيئية تفرض معايير صارمة لانبعاثات العوادم: الفئة 2 تتطلب محركات Euro 6، والفئة 3 تقتصر على السيارات الكهربائية أو الهيدروجينية أو الغازية."
                }
            }
        ];

        // --- Application Logic with Explicit Language Selection --- //
        const app = {
            lang: localStorage.getItem('taxi_lang') || 'en', // English is primary by default!
            currentView: 'home',
            score: 0,
            currentQuestionIndex: 0,
            hasAnswered: false,
            activeQuestions: [],
            currentCategoryName: '',

            init() {
                this.setLanguage(this.lang);
            },

            setLanguage(newLang) {
                this.lang = newLang;
                localStorage.setItem('taxi_lang', this.lang);

                // Update document attributes
                const htmlElement = document.documentElement;
                htmlElement.lang = this.lang;
                htmlElement.dir = this.lang === 'ar' ? 'rtl' : 'ltr';

                // Update segmented language buttons state
                ['en', 'sv', 'ar'].forEach(code => {
                    const btn = document.getElementById('lang-btn-' + code);
                    if (btn) {
                        if (code === this.lang) {
                            btn.className = "px-3 py-1 rounded-full text-xs font-black bg-slate-900 text-taxi ring-1 ring-slate-900 shadow-sm";
                        } else {
                            btn.className = "px-2.5 py-1 rounded-full text-xs font-bold text-slate-900/80 hover:bg-black/10";
                        }
                    }
                });

                this.updateStaticUI();

                // Re-render current screen with pristine pure language
                if (this.currentView === 'home') this.renderHome();
                else if (this.currentView === 'quiz') this.renderQuiz();
                else if (this.currentView === 'results') this.renderResults();
                else if (this.currentView === 'stats') this.renderStats();
                else if (this.currentView === 'settings') this.renderSettings();
            },

            t(key) {
                const dict = translations[this.lang] || translations['en'];
                return dict[key] || (translations['en'] && translations['en'][key]) || key;
            },

            updateStaticUI() {
                document.getElementById('header-title').innerText = this.t('app_title');
                document.getElementById('header-subtitle').innerText = this.t('app_sub');
                document.getElementById('nav-home-text').innerText = this.t('nav_home');
                document.getElementById('nav-stats-text').innerText = this.t('nav_stats');
                document.getElementById('nav-profile-text').innerText = this.t('nav_profile');

                // Update bottom nav highlights
                ['home', 'stats', 'profile'].forEach(tab => {
                    const btn = document.getElementById('nav-btn-' + tab);
                    if (btn) {
                        const isActive = (tab === 'home' && this.currentView === 'home') ||
                                         (tab === 'stats' && this.currentView === 'stats') ||
                                         (tab === 'profile' && this.currentView === 'settings');
                        btn.className = isActive 
                            ? "flex flex-col items-center text-taxi transition py-1"
                            : "flex flex-col items-center text-slate-400 hover:text-slate-200 transition py-1";
                    }
                });
            },

            goHome() {
                this.currentView = 'home';
                this.updateStaticUI();
                this.renderHome();
            },

            goStats() {
                this.currentView = 'stats';
                this.updateStaticUI();
                this.renderStats();
            },

            goSettings() {
                this.currentView = 'settings';
                this.updateStaticUI();
                this.renderSettings();
            },

            startQuiz(category) {
                this.currentView = 'quiz';
                this.score = 0;
                this.currentQuestionIndex = 0;
                this.hasAnswered = false;

                if (category === 'mock') {
                    this.currentCategoryName = this.t('cat_mock');
                    this.activeQuestions = [...questionsData].sort(() => 0.5 - Math.random());
                } else if (category === 'quick') {
                    this.currentCategoryName = this.t('btn_quick_quiz');
                    this.activeQuestions = [...questionsData].sort(() => 0.5 - Math.random()).slice(0, 10);
                } else {
                    const catMap = {
                        law: this.t('cat_law'),
                        safety: this.t('cat_safety'),
                        navigation: this.t('cat_navigation'),
                        equipment: this.t('cat_equipment')
                    };
                    this.currentCategoryName = catMap[category] || category;
                    this.activeQuestions = questionsData.filter(q => q.category === category);
                    if (this.activeQuestions.length === 0) {
                        this.activeQuestions = [...questionsData];
                    }
                }

                this.updateStaticUI();
                this.renderQuiz();
            },

            renderHome() {
                const lawCount = questionsData.filter(q => q.category === 'law').length;
                const safetyCount = questionsData.filter(q => q.category === 'safety').length;
                const navCount = questionsData.filter(q => q.category === 'navigation').length;
                const equipCount = questionsData.filter(q => q.category === 'equipment').length;

                const mainContent = document.getElementById('main-content');
                mainContent.innerHTML = `
                    <div class="fade-in pt-2 space-y-4">
                        <div class="mb-2">
                            <h2 class="text-2xl font-black text-white">${this.t('home_welcome')}</h2>
                            <p class="text-slate-400 text-xs mt-1 leading-relaxed">${this.t('home_subtitle')}</p>
                        </div>

                        <!-- Hero Card: Full Mock Exam -->
                        <div class="bg-gradient-to-br from-slate-850 to-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl">
                            <div class="flex items-center gap-3 mb-2.5">
                                <div class="w-11 h-11 rounded-full bg-taxi/20 flex items-center justify-center text-taxi text-xl shrink-0">
                                    <i class="fa-solid fa-graduation-cap"></i>
                                </div>
                                <div>
                                    <h3 class="font-black text-white text-base leading-tight">${this.t('cat_mock')}</h3>
                                    <span class="text-xs text-taxi font-semibold">${this.t('cat_mock_desc')}</span>
                                </div>
                            </div>
                            <p class="text-xs text-slate-300 mt-2 leading-relaxed">
                                Benchmark: 75% • Complete coverage of Swedish Transport Agency (Transportstyrelsen) standards
                            </p>
                            <div class="mt-4 flex gap-2.5">
                                <button onclick="app.startQuiz('mock')" class="flex-1 bg-taxi text-slate-900 font-extrabold py-3 rounded-xl text-sm flex items-center justify-center gap-2 shadow hover:bg-taxidark active:scale-[0.98] transition">
                                    <i class="fa-solid fa-play text-xs"></i>
                                    <span>${this.t('btn_start_mock')}</span>
                                </button>
                                <button onclick="app.startQuiz('quick')" class="flex-1 bg-slate-700 text-white font-bold py-3 rounded-xl text-sm flex items-center justify-center gap-2 hover:bg-slate-650 active:scale-[0.98] transition">
                                    <i class="fa-solid fa-bolt text-xs text-taxi"></i>
                                    <span>${this.t('btn_quick_quiz')}</span>
                                </button>
                            </div>
                        </div>

                        <div class="pt-2">
                            <h3 class="text-xs font-black text-slate-400 uppercase tracking-wider mb-3">${this.t('categories_heading')}</h3>
                        </div>

                        <!-- Category 1: Law -->
                        <div onclick="app.startQuiz('law')" class="bg-slate-800 rounded-2xl p-4 flex items-center border border-slate-700 active:bg-slate-750 transition cursor-pointer shadow-sm">
                            <div class="bg-blue-500/20 w-12 h-12 rounded-full flex items-center justify-center text-blue-400 mr-3.5 rtl:ml-3.5 rtl:mr-0 shrink-0">
                                <i class="fa-solid fa-scale-balanced text-lg"></i>
                            </div>
                            <div class="flex-1">
                                <h4 class="font-bold text-sm text-white">${this.t('cat_law')}</h4>
                                <p class="text-xs text-slate-400 mt-0.5">${this.t('cat_law_desc')}</p>
                                <span class="inline-block mt-1 text-[11px] font-bold text-taxi">${this.t('questions_badge').replace('{count}', lawCount)}</span>
                            </div>
                            <i class="fa-solid fa-chevron-right rtl:fa-chevron-left text-slate-500 text-xs"></i>
                        </div>

                        <!-- Category 2: Safety -->
                        <div onclick="app.startQuiz('safety')" class="bg-slate-800 rounded-2xl p-4 flex items-center border border-slate-700 active:bg-slate-750 transition cursor-pointer shadow-sm">
                            <div class="bg-green-500/20 w-12 h-12 rounded-full flex items-center justify-center text-green-400 mr-3.5 rtl:ml-3.5 rtl:mr-0 shrink-0">
                                <i class="fa-solid fa-shield-heart text-lg"></i>
                            </div>
                            <div class="flex-1">
                                <h4 class="font-bold text-sm text-white">${this.t('cat_safety')}</h4>
                                <p class="text-xs text-slate-400 mt-0.5">${this.t('cat_safety_desc')}</p>
                                <span class="inline-block mt-1 text-[11px] font-bold text-taxi">${this.t('questions_badge').replace('{count}', safetyCount)}</span>
                            </div>
                            <i class="fa-solid fa-chevron-right rtl:fa-chevron-left text-slate-500 text-xs"></i>
                        </div>

                        <!-- Category 3: Navigation -->
                        <div onclick="app.startQuiz('navigation')" class="bg-slate-800 rounded-2xl p-4 flex items-center border border-slate-700 active:bg-slate-750 transition cursor-pointer shadow-sm">
                            <div class="bg-taxi/20 w-12 h-12 rounded-full flex items-center justify-center text-taxi mr-3.5 rtl:ml-3.5 rtl:mr-0 shrink-0">
                                <i class="fa-solid fa-map-location-dot text-lg"></i>
                            </div>
                            <div class="flex-1">
                                <h4 class="font-bold text-sm text-white">${this.t('cat_navigation')}</h4>
                                <p class="text-xs text-slate-400 mt-0.5">${this.t('cat_navigation_desc')}</p>
                                <span class="inline-block mt-1 text-[11px] font-bold text-taxi">${this.t('questions_badge').replace('{count}', navCount)}</span>
                            </div>
                            <i class="fa-solid fa-chevron-right rtl:fa-chevron-left text-slate-500 text-xs"></i>
                        </div>

                        <!-- Category 4: Equipment & Taximeter -->
                        <div onclick="app.startQuiz('equipment')" class="bg-slate-800 rounded-2xl p-4 flex items-center border border-slate-700 active:bg-slate-750 transition cursor-pointer shadow-sm">
                            <div class="bg-purple-500/20 w-12 h-12 rounded-full flex items-center justify-center text-purple-400 mr-3.5 rtl:ml-3.5 rtl:mr-0 shrink-0">
                                <i class="fa-solid fa-gauge-high text-lg"></i>
                            </div>
                            <div class="flex-1">
                                <h4 class="font-bold text-sm text-white">${this.t('cat_equipment')}</h4>
                                <p class="text-xs text-slate-400 mt-0.5">${this.t('cat_equipment_desc')}</p>
                                <span class="inline-block mt-1 text-[11px] font-bold text-taxi">${this.t('questions_badge').replace('{count}', equipCount)}</span>
                            </div>
                            <i class="fa-solid fa-chevron-right rtl:fa-chevron-left text-slate-500 text-xs"></i>
                        </div>
                    </div>
                `;
            },

            renderQuiz() {
                this.hasAnswered = false;
                const total = this.activeQuestions.length;
                const questionData = this.activeQuestions[this.currentQuestionIndex];
                const langData = questionData[this.lang] || questionData['en'];

                const progressPct = ((this.currentQuestionIndex + 1) / total) * 100;
                const progressText = this.t('question_of')
                    .replace('{current}', this.currentQuestionIndex + 1)
                    .replace('{total}', total);

                const optionsHtml = langData.options.map((opt, idx) => `
                    <button id="opt-${idx}" class="quiz-option w-full bg-slate-800 border border-slate-700 rounded-xl p-3.5 text-start hover:border-slate-500 transition text-sm flex items-center justify-between shadow-sm" onclick="app.selectOption(${idx}, ${opt.isCorrect})">
                        <span class="font-medium text-slate-100 pr-2 rtl:pl-2 rtl:pr-0 leading-snug">${opt.text}</span>
                        <i id="opt-icon-${idx}" class="fa-solid hidden text-base shrink-0"></i>
                    </button>
                `).join('');

                const mainContent = document.getElementById('main-content');
                mainContent.innerHTML = `
                    <div class="fade-in pt-1 flex flex-col min-h-full">
                        <!-- Category & Progress Header -->
                        <div class="mb-3">
                            <div class="flex justify-between items-center text-xs text-slate-400 font-bold mb-1.5 uppercase">
                                <span class="text-taxi font-extrabold">${this.currentCategoryName}</span>
                                <span>${progressText}</span>
                            </div>
                            <div class="w-full bg-slate-800 rounded-full h-2">
                                <div class="bg-taxi h-2 rounded-full transition-all duration-300" style="width: ${progressPct}%"></div>
                            </div>
                        </div>

                        <!-- Question Card -->
                        <div class="bg-slate-850 border border-slate-700 rounded-2xl p-4 mb-3.5 shadow">
                            <h3 class="text-base font-bold text-white leading-snug">${langData.text}</h3>
                        </div>

                        <!-- Options Container -->
                        <div class="space-y-2.5 mb-4" id="options-container">
                            ${optionsHtml}
                        </div>

                        <!-- Explanation Area -->
                        <div id="explanation-box" class="hidden bg-slate-800 border-l-4 rtl:border-l-0 rtl:border-r-4 border-taxi p-3.5 rounded-xl mb-4 shadow">
                            <h4 class="font-black text-taxi mb-1 text-xs uppercase">${this.t('explanation_title')}</h4>
                            <p class="text-xs text-slate-300 leading-relaxed">${langData.explanation}</p>
                        </div>

                        <!-- Next / Finish Button -->
                        <div class="mt-auto pt-2">
                            <button id="next-btn" class="hidden w-full bg-taxi text-slate-900 font-black text-base py-3.5 rounded-xl shadow-lg active:bg-taxidark transition" onclick="app.nextQuestion()">
                                ${this.currentQuestionIndex === total - 1 ? this.t('btn_finish') : this.t('btn_next')}
                            </button>
                        </div>
                    </div>
                `;
            },

            selectOption(selectedIndex, isCorrect) {
                if (this.hasAnswered) return;
                this.hasAnswered = true;

                if (isCorrect) this.score++;

                const questionData = this.activeQuestions[this.currentQuestionIndex];
                const langData = questionData[this.lang] || questionData['en'];

                const optionsContainer = document.getElementById('options-container');
                const options = optionsContainer.getElementsByClassName('quiz-option');

                Array.from(options).forEach((optEl, idx) => {
                    optEl.classList.add('disabled-option');
                    const iconEl = document.getElementById(`opt-icon-${idx}`);
                    if (langData.options[idx].isCorrect) {
                        optEl.classList.add('correct-answer');
                        if (iconEl) {
                            iconEl.classList.remove('hidden');
                            iconEl.classList.add('fa-circle-check', 'text-white');
                        }
                    } else if (idx === selectedIndex && !isCorrect) {
                        optEl.classList.add('wrong-answer');
                        if (iconEl) {
                            iconEl.classList.remove('hidden');
                            iconEl.classList.add('fa-circle-xmark', 'text-white');
                        }
                    }
                });

                document.getElementById('explanation-box').classList.remove('hidden');
                document.getElementById('next-btn').classList.remove('hidden');
            },

            nextQuestion() {
                this.currentQuestionIndex++;
                if (this.currentQuestionIndex >= this.activeQuestions.length) {
                    this.saveTestRecord();
                    this.currentView = 'results';
                    this.renderResults();
                } else {
                    this.renderQuiz();
                }
            },

            saveTestRecord() {
                try {
                    const history = JSON.parse(localStorage.getItem('taxi_history') || '[]');
                    const total = this.activeQuestions.length;
                    const pct = Math.round((this.score / total) * 100);
                    history.push({
                        date: new Date().toISOString(),
                        category: this.currentCategoryName,
                        score: this.score,
                        total: total,
                        pct: pct,
                        passed: pct >= 75
                    });
                    localStorage.setItem('taxi_history', JSON.stringify(history));
                } catch(e) {
                    console.error("DOMStorage save error:", e);
                }
            },

            renderResults() {
                const total = this.activeQuestions.length;
                const percentage = Math.round((this.score / total) * 100);
                const isPass = percentage >= 75;

                const message = isPass ? this.t('results_pass') : this.t('results_fail');
                const ringColor = isPass ? 'border-green-500' : 'border-taxi';

                const mainContent = document.getElementById('main-content');
                mainContent.innerHTML = `
                    <div class="fade-in pt-6 flex flex-col items-center text-center">
                        <div class="w-28 h-28 rounded-full border-4 ${ringColor} flex flex-col items-center justify-center mb-4 bg-slate-800 shadow-xl">
                            <span class="text-3xl font-black text-white">${this.score}/${total}</span>
                            <span class="text-xs font-bold ${isPass ? 'text-green-400' : 'text-taxi'}">${percentage}%</span>
                        </div>

                        <h2 class="text-2xl font-black mb-1 text-white">${this.t('results_title')}</h2>
                        <p class="text-xs text-slate-300 mb-6 px-4 leading-relaxed">${message}</p>

                        <div class="w-full bg-slate-800 rounded-2xl p-4 mb-6 border border-slate-700 text-sm shadow">
                            <div class="flex justify-between py-2 border-b border-slate-700/60">
                                <span class="text-slate-400">${this.t('lbl_correct')}</span>
                                <span class="font-bold text-green-400">${this.score}</span>
                            </div>
                            <div class="flex justify-between py-2 border-b border-slate-700/60">
                                <span class="text-slate-400">${this.t('lbl_wrong')}</span>
                                <span class="font-bold text-red-400">${total - this.score}</span>
                            </div>
                            <div class="flex justify-between py-2">
                                <span class="text-slate-400">${this.t('lbl_accuracy')}</span>
                                <span class="font-bold text-taxi">${percentage}%</span>
                            </div>
                        </div>

                        <div class="w-full space-y-2.5">
                            <button onclick="app.startQuiz('mock')" class="w-full bg-taxi text-slate-900 font-extrabold py-3.5 rounded-xl shadow active:bg-taxidark transition">
                                ${this.t('btn_try_again')}
                            </button>
                            <button onclick="app.goHome()" class="w-full bg-slate-700 text-white font-semibold py-3.5 rounded-xl hover:bg-slate-650 transition">
                                ${this.t('btn_back_home')}
                            </button>
                        </div>
                    </div>
                `;
            },

            renderStats() {
                let history = [];
                try {
                    history = JSON.parse(localStorage.getItem('taxi_history') || '[]');
                } catch(e) {}

                const total = history.length;
                const passed = history.filter(h => h.passed).length;
                const rate = total > 0 ? Math.round((passed / total) * 100) : 0;
                const readinessLabel = (rate >= 75 && total >= 3) ? this.t('stat_ready_badge') : this.t('stat_needs_study');

                const mainContent = document.getElementById('main-content');
                mainContent.innerHTML = `
                    <div class="fade-in pt-2 space-y-4">
                        <h2 class="text-2xl font-black text-white">${this.t('nav_stats')}</h2>

                        <!-- Readiness Card -->
                        <div class="bg-gradient-to-br from-slate-850 to-slate-800 rounded-2xl p-4 border border-slate-700 shadow">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">${this.t('stat_readiness')}</span>
                                <span class="text-xs font-black ${rate >= 75 && total >= 3 ? 'text-green-400' : 'text-taxi'}">${readinessLabel}</span>
                            </div>
                            <div class="w-full bg-slate-900 rounded-full h-2.5 mb-2">
                                <div class="${rate >= 75 ? 'bg-green-500' : 'bg-taxi'} h-2.5 rounded-full transition-all duration-300" style="width: ${rate}%"></div>
                            </div>
                            <div class="flex justify-between text-[11px] text-slate-400 font-semibold">
                                <span>0%</span>
                                <span>Trafikverket Benchmark: 75%</span>
                                <span>100%</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 text-center shadow-sm">
                                <span class="text-2xl font-black text-taxi">${total}</span>
                                <p class="text-xs text-slate-400 mt-1 font-medium">${this.t('stat_total_tests')}</p>
                            </div>
                            <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 text-center shadow-sm">
                                <span class="text-2xl font-black ${rate >= 75 ? 'text-green-400' : 'text-taxi'}">${rate}%</span>
                                <p class="text-xs text-slate-400 mt-1 font-medium">${this.t('stat_pass_rate')}</p>
                            </div>
                        </div>

                        ${total === 0 ? `
                            <div class="bg-slate-800/80 rounded-2xl p-6 text-center border border-slate-700 text-slate-400 text-xs">
                                <i class="fa-solid fa-clipboard-question text-3xl text-slate-500 mb-2"></i>
                                <p>${this.t('no_history')}</p>
                            </div>
                        ` : `
                            <div class="pt-2">
                                <button onclick="localStorage.removeItem('taxi_history'); app.renderStats();" class="text-xs text-red-400 hover:text-red-300 underline font-medium">
                                    ${this.t('lbl_reset')}
                                </button>
                            </div>
                        `}
                    </div>
                `;
            },

            renderSettings() {
                const mainContent = document.getElementById('main-content');
                mainContent.innerHTML = `
                    <div class="fade-in pt-2 space-y-4">
                        <h2 class="text-2xl font-black text-white">${this.t('nav_profile')}</h2>

                        <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 space-y-3 shadow">
                            <h4 class="text-xs font-black text-taxi uppercase tracking-wider">${this.t('settings_lang_title')}</h4>
                            
                            <!-- Direct 1-tap language switch cards -->
                            <button onclick="app.setLanguage('en')" class="w-full flex items-center justify-between p-3.5 rounded-xl border ${this.lang === 'en' ? 'border-taxi bg-slate-850 text-taxi ring-1 ring-taxi/40' : 'border-slate-700 text-slate-300 hover:border-slate-600'} transition">
                                <div class="flex items-center gap-3">
                                    <span class="w-7 h-7 rounded-full bg-slate-900 flex items-center justify-center font-bold text-xs text-taxi">EN</span>
                                    <span class="font-bold text-sm">English (Default)</span>
                                </div>
                                ${this.lang === 'en' ? '<i class="fa-solid fa-circle-check text-taxi text-base"></i>' : ''}
                            </button>

                            <button onclick="app.setLanguage('sv')" class="w-full flex items-center justify-between p-3.5 rounded-xl border ${this.lang === 'sv' ? 'border-taxi bg-slate-850 text-taxi ring-1 ring-taxi/40' : 'border-slate-700 text-slate-300 hover:border-slate-600'} transition">
                                <div class="flex items-center gap-3">
                                    <span class="w-7 h-7 rounded-full bg-slate-900 flex items-center justify-center font-bold text-xs text-taxi">SV</span>
                                    <span class="font-bold text-sm">Svenska</span>
                                </div>
                                ${this.lang === 'sv' ? '<i class="fa-solid fa-circle-check text-taxi text-base"></i>' : ''}
                            </button>

                            <button onclick="app.setLanguage('ar')" class="w-full flex items-center justify-between p-3.5 rounded-xl border ${this.lang === 'ar' ? 'border-taxi bg-slate-850 text-taxi ring-1 ring-taxi/40' : 'border-slate-700 text-slate-300 hover:border-slate-600'} transition">
                                <div class="flex items-center gap-3">
                                    <span class="w-7 h-7 rounded-full bg-slate-900 flex items-center justify-center font-bold text-xs text-taxi">AR</span>
                                    <span class="font-bold text-sm">العربية</span>
                                </div>
                                ${this.lang === 'ar' ? '<i class="fa-solid fa-circle-check text-taxi text-base"></i>' : ''}
                            </button>
                        </div>

                        <!-- Official Swedish TFL info card -->
                        <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 text-xs text-slate-300 space-y-2 shadow">
                            <h4 class="font-bold text-white text-sm flex items-center gap-2">
                                <i class="fa-solid fa-circle-info text-taxi"></i>
                                <span>${this.t('tfl_title')}</span>
                            </h4>
                            <p class="leading-relaxed text-slate-300">${this.t('tfl_desc')}</p>
                        </div>
                    </div>
                `;
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
